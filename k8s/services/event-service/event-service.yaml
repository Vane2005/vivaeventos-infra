# ─────────────────────────────────────────────
#  event-service — PostgreSQL + App
#  Puerto app: 8082
# ─────────────────────────────────────────────

# ── PostgreSQL ────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: event-service-db-pvc
  namespace: vivaeventos
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-service-db
  namespace: vivaeventos
  labels:
    app: event-service-db
    tier: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-service-db
  template:
    metadata:
      labels:
        app: event-service-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: event-service-db-secret
                  key: db-name
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: event-service-db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: event-service-db-secret
                  key: password
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: event-service-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: event-service-db
  namespace: vivaeventos
spec:
  selector:
    app: event-service-db
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP

---
# ── App ───────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-service
  namespace: vivaeventos
  labels:
    app: event-service
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-service
  template:
    metadata:
      labels:
        app: event-service
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox
          command: ['sh', '-c', 'until nc -z event-service-db 5432; do echo waiting for db; sleep 2; done']
      containers:
        - name: event-service
          image: vane0205/vivaeventos-event-service:latest
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://event-service-db:5432/event-service"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: event-service-db-secret
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: event-service-db-secret
                  key: password
            - name: RABBITMQ_HOST
              value: "rabbitmq"
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: username
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-secret
                  key: password
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "update"
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              value: "org.postgresql.Driver"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: event-service
  namespace: vivaeventos
spec:
  selector:
    app: event-service
  ports:
    - port: 8082
      targetPort: 8082
  type: ClusterIP
