# ─────────────────────────────────────────────
#  frontend — nginx sirviendo HTML/CSS/JS
#  Puerto: 80
# ─────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: vivaeventos
  labels:
    app: frontend
    tier: frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      automountServiceAccountToken: false

      containers:
        - name: frontend
          image: vane0205/frontend:latest

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10

          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"

            limits:
              memory: "128Mi"
              cpu: "100m"

---
apiVersion: v1
kind: Service

metadata:
  name: frontend
  namespace: vivaeventos

spec:
  selector:
    app: frontend

  ports:
    - port: 80
      targetPort: 80

  type: ClusterIP
