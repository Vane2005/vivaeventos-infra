# ─────────────────────────────────────────────────────────────────────────────
#  SECRETS — vivaeventos
#
#  ⚠️  ESTE ARCHIVO ES UNA PLANTILLA. NO subas valores reales a Git.
#      Opciones recomendadas para manejar los valores:
#        1. Copiar a secrets.yaml, completar los valores en base64,
#           aplicar con kubectl y agregar secrets.yaml al .gitignore
#        2. Usar una herramienta como Sealed Secrets, Vault, o External Secrets
#
#  Para codificar en base64:
#    echo -n "mi_valor" | base64
# ─────────────────────────────────────────────────────────────────────────────

# ── RabbitMQ ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-secret
  namespace: vivaeventos
type: Opaque
data:
  username: <base64_rabbitmq_user>       # echo -n "admin" | base64
  password: <base64_rabbitmq_password>   # echo -n "tu_password" | base64

---
# ── JWT ──────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: vivaeventos
type: Opaque
data:
  secret: <base64_jwt_secret>            # echo -n "aVerySecretKey..." | base64

---
# ── User Service DB ──────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: user-service-db-secret
  namespace: vivaeventos
type: Opaque
data:
  db-name: <base64_db_name>              # echo -n "user-service-db" | base64
  username: <base64_db_user>             # echo -n "postgres" | base64
  password: <base64_db_password>

---
