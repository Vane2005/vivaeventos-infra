# ─────────────────────────────────────────────────────────────
#  Traefik — API Gateway / Ingress Controller
#  Expone el dashboard en :9000 y escucha en :80 / :443
# ─────────────────────────────────────────────────────────────

# ── RBAC: ClusterRole para que Traefik lea recursos de K8s ────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: vivaeventos
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik-role
rules:
  - apiGroups: [""]
    resources: [services, endpoints, secrets]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [update]
  - apiGroups: [traefik.io]
    resources: [middlewares, middlewaretcps, ingressroutes, traefikservices,
                ingressroutetcps, ingressrouteudps, tlsoptions, tlsstores,
                serverstransports, serverstransporttcps]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik-role
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: vivaeventos

---
# ── Deployment ────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: vivaeventos
  labels:
    app: traefik
    tier: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      serviceAccountName: traefik
      containers:
        - name: traefik
          image: traefik:v3.1
          args:
            - --api.dashboard=true
            - --api.insecure=true           # Dashboard sin auth (solo para dev; proteger en prod)
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.namespaces=vivaeventos
            - --entrypoints.web.address=:80
            - --entrypoints.websecure.address=:443
            - --log.level=INFO
            - --accesslog=true
          ports:
            - name: web
              containerPort: 80
            - name: websecure
              containerPort: 443
            - name: dashboard
              containerPort: 8080
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"

---
# ── Service LoadBalancer (punto de entrada externo) ───────────
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: vivaeventos
  labels:
    app: traefik
spec:
  selector:
    app: traefik
  ports:
    - name: web
      port: 80
      targetPort: 80
    - name: websecure
      port: 443
      targetPort: 443
    - name: dashboard
      port: 9000
      targetPort: 8080
  # Cambiar a LoadBalancer si usas un cloud provider (GKE, EKS, DO)
  # Para K3s local, NodePort es suficiente
  type: NodePort
